name: CI/CD

# main ga push: testlar -> deploy branch -> ASG rolling yangilash -> sayt tekshiruvi.
# Pull request: faqat testlar.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ASG_NAME: penaura-asg

jobs:
  test:
    name: Testlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Kutubxonalarni o'rnatish
        run: pip install -r backend/requirements.txt

      - name: Django testlari
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          PAYMENTS_MOCK: "True"
        run: python manage.py test

      - name: Migratsiyalar modellarga mosligini tekshirish
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: python manage.py makemigrations --check --dry-run

      - name: JavaScript sintaksisini tekshirish
        run: |
          fail=0
          for f in frontend/js/*.js admin/js/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail

  release:
    name: Release (deploy branch)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: deploy branch'ini yangilash
        run: git push --force origin "${GITHUB_SHA}:refs/heads/deploy"

  rollout:
    name: ASG rolling yangilash
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: AWS ga kirish
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instance refresh boshlash va kutish
        run: |
          ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":300,"SkipMatching":false}' \
            --query InstanceRefreshId --output text)
          echo "Refresh ID: $ID"
          for i in $(seq 1 90); do
            S=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$ID" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "[$i] holat: $S"
            case "$S" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "::error::Instance refresh muvaffaqiyatsiz: $S"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Instance refresh 45 daqiqada tugamadi"; exit 1

      - name: Sayt ishlayotganini tekshirish
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-connrefused \
            "$SITE_URL/api/books/" > /dev/null