services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-penaura}
      POSTGRES_USER: ${POSTGRES_USER:-penaura_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylda POSTGRES_PASSWORD yozing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_NAME: ${POSTGRES_DB:-penaura}
      DB_USER: ${POSTGRES_USER:-penaura_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8082,http://127.0.0.1:8082,http://localhost:8081,http://127.0.0.1:8081
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000,http://localhost:8081,http://127.0.0.1:8081
      FRONTEND_URL: http://localhost:8082/
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
      - static_data:/app/staticfiles

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:8000"
      - "8082:8080"
      - "8081:8081"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - ./admin:/usr/share/nginx/html/admin:ro
      - ./backend/media:/var/www/media:ro
      - static_data:/var/www/static:ro

volumes:
  pgdata:
  static_data: